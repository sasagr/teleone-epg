name: Generate Tele One EPG

# Rebuilds teleone.xml from the palinsesto page and commits it when it changes. The grid is the
# same every week, so this is really about rolling the seven-day window forward, not about the
# station changing its mind — twice a day is plenty.
on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["generate.py", ".github/workflows/epg.yml"]

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate teleone.xml
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain teleone.xml)" ]; then
            git add teleone.xml
            git commit -m "Update Tele One EPG ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "teleone.xml unchanged — nothing to commit."
          fi
